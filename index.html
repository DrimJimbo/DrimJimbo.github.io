<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/script.js" type="module" defer></script>
        <title>Mon Portfolio</title>
    </head>
    <body>
        <header>
            <h1 id="mpftext">Mon Portfolio</h1>
            <button id="navbutton">&#9776;</button>
        </header>

        <nav id="nav">
            <ul id="navigation">
                <li><a href="#aboutme">À propos de moi</a></li>
                <li><a href="#projects">Projets</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <h2 class="title">À propos de moi</h2>
        <div id="aboutme">
            <img
                id="profilepic"
                src="images/photo.png"
                alt="Photo de profil"
                width="250px"
                height="250px"
            />
            <button id="btnleft1">&larr;</button>
            <button id="btnright1">&rarr;</button>
        </div>
        <h2 class="title">Mes projets</h2>
        <div id="projects">
            <button id="btnleft">&larr;</button>
            <div id="projectactu"></div>
            <button id="btnright">&rarr;</button>
        </div>
        <h2 class="title">Contactez-moi</h2>
        <div id="contact">
            <form
                id="contact-form"
                action="https://formspree.io/f/mgoeggdo"
                method="POST"
            >
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Votre message..."
                        required
                    ></textarea>
                </div>

                <button type="submit" id="envoyerbtn">Envoyer</button>
                <p>Mon email : cavenaileaymerikpro@gmail.com</p>
            </form>
        </div>
    </body>
</html>
